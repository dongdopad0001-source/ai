name: Build Windows portable EXE

on:
  workflow_dispatch:
  push:
    branches: [work]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build self-contained executable
        shell: pwsh
        run: ./scripts/build_windows_portable.ps1
      - name: Smoke-test portable executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$PWD/dist/JeongSoyoonAI.exe" -PassThru
          try {
            $deadline = (Get-Date).AddMinutes(2)
            $healthy = $false
            do {
              try {
                $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8501/_stcore/health
                if ($response.StatusCode -eq 200) {
                  $page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8501/
                  if ($page.StatusCode -eq 200 -and $page.Content -match "<html") {
                    Write-Host "Portable EXE and Streamlit UI started successfully."
                    $healthy = $true
                    break
                  }
                }
              } catch {
                Write-Host "Waiting for Streamlit UI: $($_.Exception.Message)"
                Start-Sleep -Seconds 2
              }
            } while ((Get-Date) -lt $deadline)
            if (-not $healthy) {
              throw "The portable EXE did not expose Streamlit's health endpoint within two minutes."
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: JeongSoyoonAI-Windows
          path: dist/JeongSoyoonAI.exe
          if-no-files-found: error
