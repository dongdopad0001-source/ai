name: Build Windows portable EXE

on:
  workflow_dispatch:
  push:
    branches: [work]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build self-contained executable
        shell: pwsh
        run: ./scripts/build_windows_portable.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: JeongSoyoonAI-Windows
          path: dist/JeongSoyoonAI.exe
          if-no-files-found: error
